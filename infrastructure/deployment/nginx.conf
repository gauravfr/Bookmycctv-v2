server {
  listen 443 ssl http2;
  server_name ${PUBLIC_DOMAIN};
  ssl_certificate /etc/letsencrypt/live/${PUBLIC_DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${PUBLIC_DOMAIN}/privkey.pem;
  location /api/ { proxy_pass http://api:3000; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /hls/ { proxy_pass http://mediamtx:8888/; proxy_set_header Authorization $http_authorization; proxy_buffering off; }
  location /webrtc/ { proxy_pass http://mediamtx:8889/; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; }
}
